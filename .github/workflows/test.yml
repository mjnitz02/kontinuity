name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reliable gate: the Swift Testing unit suite must pass.
  unit:
    name: Unit tests
    # Kontinuity targets the iOS 26 SDK, which needs Xcode 26 (macOS 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The macos-26 runner image intermittently ships Xcode without the
      # matching iOS Simulator runtime pre-installed (see
      # https://github.com/actions/runner-images/issues/13220), which leaves
      # zero simulator devices available for the "Pick an iPad simulator"
      # step below to find, no matter what name it's looking for. Fetch the
      # runtime on demand instead of failing the whole job.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          if ! xcrun simctl list devices available | grep -q "iPad"; then
            echo "No iOS simulator runtime found — downloading it..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      # The runner image's iPad lineup drifts between releases, so resolve a
      # real device name instead of hardcoding one that may not exist. Prefer
      # the 11-inch Pro (matches the Makefile default and Matt's physical
      # device); fall back to whatever iPad is available otherwise. Newer
      # runtimes disambiguate same-named iPads with a chip suffix like
      # "(M5)", so that suffix must be kept, not stripped.
      - name: Pick an iPad simulator
        id: sim
        run: |
          devices=$(xcrun simctl list devices available)
          name=$(echo "$devices" | grep -E 'iPad Pro 11-inch' | head -1)
          if [ -z "$name" ]; then
            name=$(echo "$devices" | grep -E 'iPad' | head -1)
          fi
          name=$(echo "$name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/ \([0-9A-F-]+\) \([A-Za-z]+\)$//')
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: make test-unit SIMULATOR_NAME="${{ steps.sim.outputs.name }}"

  # Separate job: XCUITests boot a simulator and drive the real app, so they're
  # minutes rather than seconds. Keeping them off the unit job means a logic
  # regression still reports fast. They're too slow to run on every PR push,
  # so they're a post-merge validation only: skipped on `pull_request`, run
  # on pushes to main.
  ui:
    name: UI tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # See the unit job's step of the same name for why this is needed.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          if ! xcrun simctl list devices available | grep -q "iPad"; then
            echo "No iOS simulator runtime found — downloading it..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      # See the unit job's step of the same name for why the chip suffix
      # (e.g. "(M5)") must be kept and 11-inch Pro is preferred.
      - name: Pick an iPad simulator
        id: sim
        run: |
          devices=$(xcrun simctl list devices available)
          name=$(echo "$devices" | grep -E 'iPad Pro 11-inch' | head -1)
          if [ -z "$name" ]; then
            name=$(echo "$devices" | grep -E 'iPad' | head -1)
          fi
          name=$(echo "$name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/ \([0-9A-F-]+\) \([A-Za-z]+\)$//')
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        run: make test-ui SIMULATOR_NAME="${{ steps.sim.outputs.name }}"
