name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# head_ref (PR source branch) falls back to ref (push), so push + PR runs for
# one branch share a group instead of running twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint + SwiftFormat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # SwiftLint/SwiftFormat are pinned versions fetched by the Makefile
      # itself (see SWIFTFORMAT_VERSION/SWIFTLINT_VERSION) — no separate
      # install step, so CI can never drift from a local `make lint`.
      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint
