name: CodeQL

# Swift analysis has to build the project, so it needs a macOS runner and takes
# far longer than the lint job. It therefore runs on merges to main and on a
# weekly schedule rather than on every PR — findings land in the Security tab
# instead of gating the merge.
on:
  push:
    branches: [main]
  schedule:
    # Mondays, 09:47 UTC. Offset from the other repos so the weekly runs don't
    # all queue at once.
    - cron: '47 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Matches the runner in test.yml. Keep these two in step.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      # Uploading results to the Security tab needs write here; everything
      # else stays read-only.
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # See the matching step in test.yml for why this is needed.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          if ! xcrun simctl list devices available | grep -q "iPad"; then
            echo "No iOS simulator runtime found — downloading it..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      # Same resolution logic as test.yml — the runner's iPad lineup drifts
      # between images, so don't hardcode a device name.
      - name: Pick an iPad simulator
        id: sim
        run: |
          devices=$(xcrun simctl list devices available)
          name=$(echo "$devices" | grep -E 'iPad Pro 11-inch' | head -1)
          if [ -z "$name" ]; then
            name=$(echo "$devices" | grep -E 'iPad' | head -1)
          fi
          name=$(echo "$name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/ \([0-9A-F-]+\) \([A-Za-z]+\)$//')
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # build-mode: manual, not autobuild. Autobuild guesses `swift build
      # --package-path KontinuityCore`, which compiles the package for the host
      # (macOS) rather than iOS. Package.swift declares only `.iOS("26.0")`, so
      # SwiftPM falls back to an ancient macOS deployment target and every
      # SwiftData @Model expansion fails with "'Schema' is only available in
      # macOS 14 or newer". Driving the real xcodebuild target instead analyzes
      # what actually ships.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: make build SIMULATOR_NAME="${{ steps.sim.outputs.name }}"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:swift
