# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The `swift` directory below must match the directory holding Package.swift.
# It previously read /MemoryEchoCore — copied from the memory-echo repo — which
# doesn't exist here, so Swift updates silently never ran. If the package is
# ever moved or renamed, this path has to move with it.

version: 2

# One group spanning every ecosystem, so a week's version updates arrive as a
# single PR instead of one per ecosystem. dependabot-automerge.yml merges that
# PR once the required checks pass.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "swift"
    directory: "/KontinuityCore"
    # `patterns` is required on every member of a multi-ecosystem group.
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    # Nobody reviews these PRs before they merge, so wait a week after a
    # release: time for a compromised or broken version to be yanked upstream.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
